<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Send Anonymous</title>
</head>
<html>
<body>
<div class="app-root" id="app">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <div class="admin-corner">
        <div class="admin-dot" onclick="openAdminLogin()" title="Admin Login">🔑</div>
    </div>

    <div class="screen active" id="screen-user">
        <div class="logo-area">
            <div class="logo-icon">👻</div>
            <div class="logo-title">Send Anonymous</div>
            <div class="logo-sub">No name. No trace. Just words.</div>
        </div>
        <div class="message-card">
            <div class="msg-label">Your Message</div>
            <textarea class="msg-textarea" id="msgInput" placeholder="Write anything... your secret is safe 🤫"
                maxlength="1000" oninput="updateChar()"></textarea>
            <div class="char-count"><span id="charCount">0</span>/1000</div>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">⟶ SEND ANONYMOUSLY</button>
        </div>
    </div>

    <div class="screen" id="screen-admin">
        <div class="admin-screen">
            <div class="admin-header">
                <h2>📬 Admin Panel</h2>
                <button class="logout-btn" onclick="adminLogout()">Logout</button>
            </div>
            <div class="msg-count" id="msgCount"></div>
            <div id="msgList"></div>
        </div>
    </div>
</div>

<div class="modal-bg" id="loginModal">
    <div class="modal-box">
        <div class="modal-title">🔐 Admin Login</div>
        <button class="close-btn" onclick="closeModal()">✕</button>
        <div class="field"><label>Email</label><input type="email" id="adminEmail" placeholder="admin@example.com" />
        </div>
        <div class="field"><label>Password</label><input type="password" id="adminPass" placeholder="••••••••" /></div>
        <button class="login-btn" id="loginBtn" onclick="doLogin()">LOGIN →</button>
        <div class="err-msg" id="loginErr"></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="script.js"></script>
</body>
</html>
